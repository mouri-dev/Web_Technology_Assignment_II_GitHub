<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <form id="registrationForm" action="../php/add_student.php"
          method="POST" enctype="multipart/form-data" novalidate>

        <h1>Student Registration</h1>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        <small class="error" id="nameError"></small>

        <label for="rollNo">Roll Number</label>
        <input type="text" id="rollNo" name="roll_no" required>
        <small class="error" id="rollError"></small>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <small class="error" id="emailError"></small>

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="CSE">Computer Science and Engineering</option>
            <option value="ECE">Electronics and Communication Engineering</option>
            <option value="EEE">Electrical and Electronics Engineering</option>
            <option value="IT">Information Technology</option>
        </select>
        <small class="error" id="courseError"></small>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <small class="error" id="passwordError"></small>

        <label for="file">Profile Image / Document</label>
        <input type="file" id="file" name="file">
        <small class="error" id="fileError"></small>

        <button type="submit">Register Student</button>
    </form>
</div>
<script src="validation.js"></script>
</body>
</html>
